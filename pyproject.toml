[project]
name = "moment-zeroshot-ad"
version = "0.1.0"
description = "Zero-shot anomaly detection with MOMENT: reproduction and rigorous evaluation"
readme = "README.md"
requires-python = "==3.11.*"  # momentfm 0.1.4 pins numpy 1.25.2: no wheels for Python >= 3.12
dependencies = [
    "matplotlib>=3.11.2",
    "momentfm==0.1.4",
    "pandas>=2.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zsad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
